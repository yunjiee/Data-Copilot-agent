[project]
name = "data-copilot"
version = "0.1.0"
description = "Data Copilot - 智慧電商數據與知識整合助理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.4.0",
    "google-adk>=2.9,<3",
    "google-cloud-bigquery>=3.42.2",
    "markitdown[pptx]>=0.1.7",
    "matplotlib>=3.11.2",
    "mcp[cli]>=1.28,<2",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "torch==2.14.1",
    # sklearn 1.9.x 的 .pyd 在啟用 Smart App Control 的 Windows 上會被封鎖，導致 RAG 載入失敗
    "scikit-learn>=1.7,<1.8",
    "vl-convert-python>=1.9.0.post1",
    "langchain-core>=1.6.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-huggingface>=0.1.0",
    "numpy>=1.26.0",
    "defusedxml>=0.7.1",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["my_agent", "mcp_servers"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
